name: Build APK and AAB · Latest release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-main
  cancel-in-progress: true
jobs:
  native:
    name: Native engines (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Cache NDK and upstream downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .downloads/android-ndk-r30
            native/sources
            third_party
          key: ndk-r30-upstream-${{ hashFiles('ci/dependencies.json') }}
      - name: Cache compiled native engines
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/main/jniLibs/${{ matrix.abi }}
          key: native-v1-${{ matrix.abi }}-${{ hashFiles('native/*.c', 'native/*.h', 'native/patches/**', 'native/sources/*.json', 'scripts/build*', 'tools/native_cc.py', 'ci/build-native.sh', 'ci/bootstrap.py', 'ci/dependencies.json') }}
      - name: Prepare Linux build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config gettext autopoint bison flex ninja-build cmake gawk libtool-bin clang
          python3 ci/bootstrap.py --native
      - name: Build all native engines from verified sources
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash ci/build-native.sh '${{ matrix.abi }}'
      - name: Upload native engines (GitHub-to-GitHub only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.abi }}
          path: app/src/main/jniLibs/
          retention-days: 2
      - name: Build failure diagnostics
        if: failure()
        run: |
          find artifacts -name '*build.log' -o -name '*deps*log' -o -name '*xfs*log' | while read -r p; do echo "### $p"; tail -n 60 "$p"; done
  release:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CI_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEY_ALIAS: upload
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: app/src/main/jniLibs
          merge-multiple: true
      - name: Restore verified upstream sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/sources
            third_party
          key: package-sources-${{ hashFiles('ci/dependencies.json') }}
      - name: Configure persistent release signing and version
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "CI_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "CI_VERSION_NAME=0.16.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build, validate and sign APK and AAB
        run: bash ci/package-release.sh
      - name: Publish complete release and mark Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          printf 'Automated signed build from commit %s.\nVersion %s, code %s.\n\nNew release signing key: does not update an older QA APK signed with the debug key. These binaries do not certify USB/boot compatibility.\n' "$GITHUB_SHA" "$CI_VERSION_NAME" "$CI_VERSION_CODE" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "USB Workbench $CI_VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" artifacts/release/* --clobber
          gh release edit "$tag" --draft=false --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
